defaults:
  - _self_
  - task: acrobot_swingup_original
  - agent: relaxed_equiv/${task}

# task settings
frame_stack: 3
action_repeat: 2
discount: 0.99
# train settings
num_seed_frames: 4000
# eval
eval_every_frames: 20000
num_eval_episodes: 10
# test
num_test_episodes: 40
# snapshot
save_snapshot: true
resume: true
# replay buffer
replay_buffer_size: 500000
replay_buffer_num_workers: 4
nstep: 3
batch_size: 256
# misc
seed: 1
device: cuda
save_video: true
save_train_video: false
mixed_precision: false
# experiment
experiment: exp
# agent
lr: 1e-4
feature_dim: 50

wandb:
  entity: null
  project: ${domain}_${task}_${variant}
  name: ${agent.name}
  id: null
  resume: "allow"
  dir: "."
  sync_tensorboard: false
  monitor_gym: false

hydra:
  job:
    chdir: true
  run:
    dir: ./exp_local/${experiment}/${domain}_${task}_${variant}/${agent.name}/seed${seed}
